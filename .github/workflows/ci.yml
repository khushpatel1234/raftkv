name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Java 21 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify shell and Python helpers
        run: |
          bash -n scripts/cluster.sh scripts/smoke.sh bench/run.sh
          python3 -m py_compile bench/resp_bench.py
          docker compose config --quiet

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

  image:
    name: Container build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag raftkv:ci .
